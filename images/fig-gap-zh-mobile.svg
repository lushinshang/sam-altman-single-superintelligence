<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 614" width="420" height="614" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">從類比走到結論，中間還空著三塊</title><desc id="d">示意圖：左邊是奧特曼的類比，社會靠很多人互相制衡才維持強健；右邊是他的直覺偏好，寧要一兆個略超人的 AI；中間有三塊訪談沒有處理的條件：同一模型的複本失誤是否獨立、誰擁有與部署、團隊加總要不要也設上限。本文分析，非講者原圖。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5750"/></marker></defs><rect x="0" y="0" width="420" height="614" rx="14" fill="#fffdf9" stroke="#d9d3c7"/><text x="24" y="44" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan x="24" dy="0">從類比走到結論，中間還空著三塊</tspan></text><rect x="30" y="64" width="360" height="76" rx="12" fill="#e3ecfb" stroke="#1f5f99" stroke-width="2"/><text x="210" y="97" font-size="19" font-weight="700" fill="#1f5f99" text-anchor="middle"><tspan x="210" dy="0">社會靠很多人互相制衡，才維持強健</tspan></text><text x="210" y="122.8" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="210" dy="0">23:43 奧特曼的類比</tspan></text><path d="M210 144 L210 178" fill="none" stroke="#6b665d" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ar)"/><text x="210" y="204" font-size="18" font-weight="700" fill="#b3392b" text-anchor="middle"><tspan x="210" dy="0">訪談沒有處理</tspan></text><rect x="50" y="216" width="320" height="76" rx="12" fill="#fffdf9" stroke="#b3392b" stroke-width="2" stroke-dasharray="7 5"/><text x="210" y="249" font-size="19" font-weight="700" fill="#b3392b" text-anchor="middle"><tspan x="210" dy="0">獨立性</tspan></text><text x="210" y="274.8" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="210" dy="0">同一模型的複本，失誤夠獨立嗎？</tspan></text><rect x="50" y="304" width="320" height="76" rx="12" fill="#fffdf9" stroke="#b3392b" stroke-width="2" stroke-dasharray="7 5"/><text x="210" y="337" font-size="19" font-weight="700" fill="#b3392b" text-anchor="middle"><tspan x="210" dy="0">所有權</tspan></text><text x="210" y="362.8" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="210" dy="0">誰擁有、誰部署？</tspan></text><rect x="50" y="392" width="320" height="76" rx="12" fill="#fffdf9" stroke="#b3392b" stroke-width="2" stroke-dasharray="7 5"/><text x="210" y="425" font-size="19" font-weight="700" fill="#b3392b" text-anchor="middle"><tspan x="210" dy="0">團隊上限</tspan></text><text x="210" y="450.8" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="210" dy="0">加總之後，要不要也設上限？</tspan></text><path d="M210 472 L210 506" fill="none" stroke="#6b665d" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="30" y="514" width="360" height="76" rx="12" fill="#e3ecfb" stroke="#1f5f99" stroke-width="2"/><text x="210" y="547" font-size="19" font-weight="700" fill="#1f5f99" text-anchor="middle"><tspan x="210" dy="0">寧要一兆個略超人的 AI</tspan></text><text x="210" y="572.8" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="210" dy="0">24:13 奧特曼的直覺偏好</tspan></text></svg>
