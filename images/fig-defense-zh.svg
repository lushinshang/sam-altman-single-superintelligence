<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 409" width="870" height="409" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">三道防線，最後都押在對齊</title><desc id="d">流程圖：沙箱隔離撐不住時交給監控，監控最後靠模型真的對齊；若完全信任對齊，才能讓模型幫忙蓋更好的沙箱，回到沙箱隔離。標註的時間是訪談中的位置。本文歸納，非講者原圖。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5750"/></marker></defs><rect x="0" y="0" width="870" height="409" rx="14" fill="#fffdf9" stroke="#d9d3c7"/><text x="30" y="46" font-size="24" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan x="30" dy="0">三道防線，最後都押在對齊</tspan></text><rect x="30" y="80" width="190" height="99.28" rx="12" fill="#fffdf9" stroke="#6b665d" stroke-width="2"/><text x="125" y="114" font-size="20" font-weight="700" fill="#6b665d" text-anchor="middle"><tspan x="125" dy="0">沙箱隔離</tspan></text><text x="125" y="140" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="125" dy="0">10:08 有效到某個程度</tspan></text><rect x="340" y="80" width="190" height="99.28" rx="12" fill="#fffdf9" stroke="#6b665d" stroke-width="2"/><text x="435" y="114" font-size="20" font-weight="700" fill="#6b665d" text-anchor="middle"><tspan x="435" dy="0">監控</tspan></text><text x="435" y="140" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="435" dy="0">10:11 看思維鏈與</tspan><tspan x="435" dy="22.08">啟動值</tspan></text><rect x="650" y="80" width="190" height="99.28" rx="12" fill="#dff1e8" stroke="#0b5c51" stroke-width="2"/><text x="745" y="114" font-size="20" font-weight="700" fill="#0b5c51" text-anchor="middle"><tspan x="745" dy="0">對齊</tspan></text><text x="745" y="140" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="745" dy="0">10:24 要有極大的信心，</tspan><tspan x="745" dy="22.08">相信模型真的對齊</tspan></text><path d="M226 129.64 L334 129.64" fill="none" stroke="#5b5750" stroke-width="2.4" marker-end="url(#ar)"/><path d="M536 129.64 L644 129.64" fill="none" stroke="#5b5750" stroke-width="2.4" marker-end="url(#ar)"/><text x="280" y="111.64" font-size="16" font-weight="400" fill="#5b5750" text-anchor="middle"><tspan x="280" dy="0">撐不住時交給</tspan></text><text x="590" y="111.64" font-size="16" font-weight="400" fill="#5b5750" text-anchor="middle"><tspan x="590" dy="0">最後靠</tspan></text><rect x="340" y="249.28" width="190" height="70" rx="12" fill="#fffdf9" stroke="#b3392b" stroke-width="2" stroke-dasharray="7 5"/><text x="435" y="279.28" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="435" dy="0">10:52 讓模型幫忙蓋更</tspan><tspan x="435" dy="22.08">好的沙箱</tspan></text><path d="M745 185.28 L745 284.28 L536 284.28" fill="none" stroke="#b3392b" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ar)"/><path d="M338 284.28 L125 284.28 L125 187.28" fill="none" stroke="#b3392b" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ar)"/><text x="637.5" y="270.28" font-size="16" font-weight="400" fill="#b3392b" text-anchor="middle"><tspan x="637.5" dy="0">完全信任對齊之後</tspan></text><text x="435" y="377.28" font-size="22" font-weight="700" fill="#0b5c51" text-anchor="middle"><tspan x="435" dy="0">前兩道的保證，最後都借自第三道</tspan></text></svg>
