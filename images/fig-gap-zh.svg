<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 410" width="870" height="410" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">從類比走到結論，中間還空著三塊</title><desc id="d">示意圖：左邊是奧特曼的類比，社會靠很多人互相制衡才維持強健；右邊是他的直覺偏好，寧要一兆個略超人的 AI；中間有三塊訪談沒有處理的條件：同一模型的複本失誤是否獨立、誰擁有與部署、團隊加總要不要也設上限。本文分析，非講者原圖。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5750"/></marker></defs><rect x="0" y="0" width="870" height="410" rx="14" fill="#fffdf9" stroke="#d9d3c7"/><text x="30" y="46" font-size="24" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan x="30" dy="0">從類比走到結論，中間還空著三塊</tspan></text><text x="435" y="108" font-size="18" font-weight="700" fill="#b3392b" text-anchor="middle"><tspan x="435" dy="0">訪談沒有處理</tspan></text><rect x="30" y="192" width="230" height="102.22" rx="12" fill="#e3ecfb" stroke="#1f5f99" stroke-width="2"/><text x="145" y="225" font-size="19" font-weight="700" fill="#1f5f99" text-anchor="middle"><tspan x="145" dy="0">社會靠很多人互相制衡，</tspan><tspan x="145" dy="26.22">才維持強健</tspan></text><text x="145" y="277.02" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="145" dy="0">23:43 奧特曼的類比</tspan></text><rect x="610" y="207" width="230" height="102.22" rx="12" fill="#e3ecfb" stroke="#1f5f99" stroke-width="2"/><text x="725" y="240" font-size="19" font-weight="700" fill="#1f5f99" text-anchor="middle"><tspan x="725" dy="0">寧要一兆個略超人</tspan><tspan x="725" dy="26.22">的 AI</tspan></text><text x="725" y="292.02" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="725" dy="0">24:13 奧特曼的直覺偏好</tspan></text><rect x="300" y="124" width="270" height="76" rx="12" fill="#fffdf9" stroke="#b3392b" stroke-width="2" stroke-dasharray="7 5"/><text x="435" y="157" font-size="19" font-weight="700" fill="#b3392b" text-anchor="middle"><tspan x="435" dy="0">獨立性</tspan></text><text x="435" y="182.8" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="435" dy="0">同一模型的複本，失誤夠獨立嗎？</tspan></text><rect x="300" y="214" width="270" height="76" rx="12" fill="#fffdf9" stroke="#b3392b" stroke-width="2" stroke-dasharray="7 5"/><text x="435" y="247" font-size="19" font-weight="700" fill="#b3392b" text-anchor="middle"><tspan x="435" dy="0">所有權</tspan></text><text x="435" y="272.8" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="435" dy="0">誰擁有、誰部署？</tspan></text><rect x="300" y="304" width="270" height="76" rx="12" fill="#fffdf9" stroke="#b3392b" stroke-width="2" stroke-dasharray="7 5"/><text x="435" y="337" font-size="19" font-weight="700" fill="#b3392b" text-anchor="middle"><tspan x="435" dy="0">團隊上限</tspan></text><text x="435" y="362.8" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="435" dy="0">加總之後，要不要也設上限？</tspan></text><path d="M264 252 L292 252" fill="none" stroke="#6b665d" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ar)"/><path d="M574 252 L602 252" fill="none" stroke="#6b665d" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ar)"/></svg>
