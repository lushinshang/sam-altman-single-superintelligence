<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 652" width="420" height="652" role="img" aria-labelledby="t d" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title id="t">三道防線，最後都押在對齊</title><desc id="d">流程圖：沙箱隔離撐不住時交給監控，監控最後靠模型真的對齊；若完全信任對齊，才能讓模型幫忙蓋更好的沙箱，回到沙箱隔離。標註的時間是訪談中的位置。本文歸納，非講者原圖。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b5750"/></marker></defs><rect x="0" y="0" width="420" height="652" rx="14" fill="#fffdf9" stroke="#d9d3c7"/><text x="24" y="44" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start"><tspan x="24" dy="0">三道防線，最後都押在對齊</tspan></text><rect x="30" y="66" width="300" height="77.2" rx="12" fill="#fffdf9" stroke="#6b665d" stroke-width="2"/><text x="180" y="100" font-size="20" font-weight="700" fill="#6b665d" text-anchor="middle"><tspan x="180" dy="0">沙箱隔離</tspan></text><text x="180" y="126" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="180" dy="0">10:08 有效到某個程度</tspan></text><rect x="30" y="207.2" width="300" height="77.2" rx="12" fill="#fffdf9" stroke="#6b665d" stroke-width="2"/><text x="180" y="241.2" font-size="20" font-weight="700" fill="#6b665d" text-anchor="middle"><tspan x="180" dy="0">監控</tspan></text><text x="180" y="267.2" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="180" dy="0">10:11 看思維鏈與啟動值</tspan></text><rect x="30" y="348.4" width="300" height="99.28" rx="12" fill="#dff1e8" stroke="#0b5c51" stroke-width="2"/><text x="180" y="382.4" font-size="20" font-weight="700" fill="#0b5c51" text-anchor="middle"><tspan x="180" dy="0">對齊</tspan></text><text x="180" y="408.4" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="180" dy="0">10:24 要有極大的信心，相信模型真</tspan><tspan x="180" dy="22.08">的對齊</tspan></text><path d="M180 147.2 L180 201.2" fill="none" stroke="#5b5750" stroke-width="2.4" marker-end="url(#ar)"/><text x="192" y="179.2" font-size="16" font-weight="400" fill="#5b5750" text-anchor="start"><tspan x="192" dy="0">撐不住時交給</tspan></text><path d="M180 288.4 L180 342.4" fill="none" stroke="#5b5750" stroke-width="2.4" marker-end="url(#ar)"/><text x="192" y="320.4" font-size="16" font-weight="400" fill="#5b5750" text-anchor="start"><tspan x="192" dy="0">最後靠</tspan></text><rect x="30" y="511.68" width="300" height="64" rx="12" fill="#fffdf9" stroke="#b3392b" stroke-width="2" stroke-dasharray="7 5"/><text x="180" y="541.68" font-size="16" font-weight="400" fill="#1a1a1a" text-anchor="middle"><tspan x="180" dy="0">10:52 讓模型幫忙蓋更好的沙箱</tspan></text><path d="M180 451.68 L180 505.68" fill="none" stroke="#b3392b" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ar)"/><text x="192" y="483.68" font-size="16" font-weight="400" fill="#b3392b" text-anchor="start"><tspan x="192" dy="0">完全信任對齊之後</tspan></text><path d="M332 543.68 L370 543.68 L370 104.6 L338 104.6" fill="none" stroke="#b3392b" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ar)"/><text x="210" y="624.68" font-size="19" font-weight="700" fill="#0b5c51" text-anchor="middle"><tspan x="210" dy="0">前兩道的保證，最後都借自第三道</tspan></text></svg>
